version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: insurance-postgres
    environment:
      POSTGRES_DB: insurance
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_user -d insurance"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    container_name: insurance-localstack
    environment:
      SERVICES: sqs,sns
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: insurance-wiremock
    ports:
      - "8089:8080"
    volumes:
      - ./src/main/resources/wiremock:/home/wiremock

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
      wiremock:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/insurance
      SPRING_DATASOURCE_USERNAME: insurance_user
      SPRING_DATASOURCE_PASSWORD: insurance_pass
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  localstack_data: