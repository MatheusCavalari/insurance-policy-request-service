server:
  port: 8080

spring:
  application:
    name: insurance-policy-request-service

  datasource:
    url: jdbc:postgresql://localhost:5432/insurance
    username: insurance_user
    password: insurance_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: INFO